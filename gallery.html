<section class="{{piCls}}" aria-label="Product">

<sc-if value="{{isCarousel}}" hint-placeholder-val="{{yes}}">
<div class="gal" role="region" aria-roledescription="carousel" aria-label="Product images">
<div class="gal__stage">
<span class="gal__count" aria-live="polite">{{cur.count}}</span>
<div class="gal__track" id="gal-track" onScroll="{{trackScroll}}">
<sc-for list="{{media}}" as="m" hint-placeholder-count="5"><div class="gal__slide">
<sc-if value="{{m.isImg}}" hint-placeholder-val="{{yes}}"><img src="{{m.src}}" alt="{{m.alt}}"></sc-if>
<sc-if value="{{m.isVideo}}" hint-placeholder-val="{{no}}"><video src="assets/823301a05a85f42b1cc914fce7813278.mp4" poster="assets/a54b8d729277641a91ea0ccb166779bc.jpg" controls="" muted="" loop="" playsinline="" aria-label="The Crow on the bike"></video></sc-if>
</div></sc-for>
</div>
</div>
<div class="gal__nav">
<div class="thumbs" role="group" aria-label="Choose an image">
<sc-for list="{{media}}" as="m" hint-placeholder-count="5"><button type="button" class="thumb" aria-current="{{m.current}}" aria-label="{{m.label}}" onClick="{{m.pick}}"><img src="{{m.thumb}}" alt=""><sc-if value="{{m.isVideo}}" hint-placeholder-val="{{no}}"><svg class="thumb__play" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4l10 6-10 6z"></path></svg></sc-if></button></sc-for>
</div>
<div class="gal__arrows">
<button type="button" class="sq sq--lg" aria-label="Previous image" onClick="{{prevMedia}}"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true"><path d="M12.5 4l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button type="button" class="sq sq--lg" aria-label="Next image" onClick="{{nextMedia}}"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true"><path d="M7.5 4l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{isGrid}}" hint-placeholder-val="{{no}}">
<div>
<div class="mg" id="mg" role="region" aria-label="Product images" onScroll="{{mgScroll}}">
<sc-for list="{{media}}" as="m" hint-placeholder-count="5"><div class="mg__slot">
<sc-if value="{{m.isImg}}" hint-placeholder-val="{{yes}}"><img src="{{m.src}}" alt="{{m.alt}}"></sc-if>
<sc-if value="{{m.isVideo}}" hint-placeholder-val="{{no}}"><video src="assets/823301a05a85f42b1cc914fce7813278.mp4" poster="assets/a54b8d729277641a91ea0ccb166779bc.jpg" controls="" muted="" loop="" playsinline="" aria-label="The Crow on the bike"></video></sc-if>
<span class="mg__count">{{m.count}}</span>
<sc-if value="{{m.isImg}}" hint-placeholder-val="{{yes}}"><button type="button" class="mg__zoom" aria-label="Zoom image" onClick="{{m.zoom}}"><svg class="ic" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="4.75" stroke="currentColor" stroke-width="1.2"></circle><path d="m12.5 12.5 3.25 3.25M9 7v4M7 9h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button></sc-if>
</div></sc-for>
</div>
<div class="mg__dots" aria-hidden="true"><sc-for list="{{media}}" as="m" hint-placeholder-count="5"><i class="{{m.dot}}"></i></sc-for></div>
</div>
</sc-if>

<div class="details">
<div class="d-row">
<a href="#reviews" aria-label="Rated 4.9 out of 5 from 1,707 reviews" style="text-decoration: none;"><x-import component-from-global-scope="IndieRidge.Rating" value="{{rating}}" count="{{reviewCount}}"></x-import></a>
<div class="badges"><span class="badge badge--new">New</span><span class="badge badge--line">Waterproof</span></div>
</div>
<h1 class="title">The Crow<sup>6.75</sup></h1>
<div class="d-row subrow"><p>{{subtitle}}</p><p>$195</p></div>
<div class="d-row verrow"><b>VERSION 6.75</b><span>Released [Month YYYY]</span></div>

<div class="toggle" role="group" aria-label="Show sizing and fit for">
<button type="button" aria-pressed="{{mensPressed}}" onClick="{{setMens}}">Men's</button>
<button type="button" aria-pressed="{{womensPressed}}" onClick="{{setWomens}}">Women's</button>
</div>

<p class="label16 optlabel">Sole color: <span class="optval">{{soleName}}</span></p>
<div class="soles" role="radiogroup" aria-label="Sole color">
<sc-for list="{{soles}}" as="s" hint-placeholder-count="3"><button type="button" role="radio" class="sole" aria-checked="{{s.checked}}" aria-label="{{s.label}} sole" title="{{s.label}}" onClick="{{s.pick}}" style="background: linear-gradient(135deg, #2b2b2b 50%, {{s.color}} 50%);"></button></sc-for>
</div>

<p class="label16 optlabel">{{sizesLabel}}: {{size}}</p>
<div class="sizes" role="radiogroup" aria-label="{{sizesLabel}}">
<sc-for list="{{sizeOptions}}" as="o" hint-placeholder-count="11"><button type="button" role="radio" class="{{o.cls}}" aria-checked="{{o.checked}}" aria-label="{{o.aria}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
</div>
<div class="d-row sizes-foot"><button type="button" class="link" style="padding: 0; border: 0; background: none; cursor: pointer; font-size: 13px;" onClick="{{openSize}}">Size guide</button><span>Free size exchanges</span></div>
<div class="fit"><svg class="ic" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.25" stroke="currentColor"></circle><path d="M10 9v5M10 6.5v.5" stroke="currentColor" stroke-linecap="round"></path></svg><span>{{fitNote}}</span></div>

<p class="stock" role="status"><i style="background: {{stockDot}};"></i>{{stockText}}</p>
<div class="buy">
<div class="qty"><button type="button" aria-label="Decrease quantity" onClick="{{dec}}">−</button><input aria-label="Quantity" value="{{qty}}" readonly=""><button type="button" aria-label="Increase quantity" onClick="{{inc}}">+</button></div>
<sc-if value="{{inStock}}" hint-placeholder-val="{{yes}}"><button type="button" class="btn-red" onClick="{{add}}">{{addLabel}}</button></sc-if>
<sc-if value="{{soldOut}}" hint-placeholder-val="{{no}}"><button type="button" class="btn-red btn-soldout" disabled="">Sold out</button></sc-if>
</div>
<sc-if value="{{soldOut}}" hint-placeholder-val="{{no}}">
<sc-if value="{{notNotified}}" hint-placeholder-val="{{yes}}">
<form class="bis" onSubmit="{{notify}}">
<p class="bis__h">Get an email when size {{size}} is back</p>
<label for="bis-email" style="font-size: 13px;">Email address</label>
<div class="bis__row"><input class="field" id="bis-email" type="email" placeholder="you@example.com"><button type="submit" class="btn-red bis__btn">Notify me</button></div>
